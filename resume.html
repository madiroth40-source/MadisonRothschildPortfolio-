<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume — Madison Rothschild</title>
<meta name="description" content="Madison Rothschild — resume. Marketing: content, creative & brand strategy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jost:ital,wght@0,300;0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<style>
  :root{
    --bg:#ECE8E1;
    --ink:#3B3733;
    --taupe:#8E8174;
    --taupe-dark:#6F6457;
    --cream:#F6F3EE;
    --line:#C9C2B7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Jost',sans-serif;font-weight:300;line-height:1.65}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1020px;margin:0 auto;padding:0 24px}
  .display{font-family:'Bebas Neue',sans-serif;letter-spacing:.02em;line-height:.92;color:var(--taupe-dark)}
  .script{font-family:'Pinyon Script',cursive;color:var(--taupe);font-weight:400}

  nav{position:sticky;top:0;z-index:50;background:rgba(236,232,225,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav-inner{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;max-width:1020px;margin:0 auto}
  .nav-inner .logo{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:.18em}
  .nav-links{display:flex;gap:28px;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase}
  .nav-links a:hover{color:var(--taupe)}

  header{padding:60px 0 36px;text-align:center}
  header h1{font-size:clamp(3rem,9vw,6rem)}
  header .script{font-size:clamp(1.4rem,3vw,2rem)}
  .actions{display:flex;justify-content:center;gap:16px;margin:28px 0 40px;flex-wrap:wrap}
  .btn{display:inline-block;padding:13px 34px;border:1px solid var(--ink);border-radius:100px;font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;transition:all .25s ease}
  .btn:hover{background:var(--ink);color:var(--cream)}
  .btn.solid{background:var(--ink);color:var(--cream)}
  .btn.solid:hover{background:var(--taupe-dark);border-color:var(--taupe-dark)}

  .viewer{background:var(--cream);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:48px}
  .viewer object{display:block;width:100%;height:85vh}
  .fallback{padding:60px 24px;text-align:center}
  .fallback p{max-width:460px;margin:0 auto 24px}

  footer{border-top:1px solid var(--line);padding:26px 0;text-align:center;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--taupe)}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="index.html">Madison Rothschild</a>
    <div class="nav-links">
      <a href="index.html">← Back to portfolio</a>
    </div>
  </div>
</nav>

<header>
  <div class="wrap">
    <p class="script">curriculum vitae</p>
    <h1 class="display">Resume</h1>
    <div class="actions">
      <a class="btn solid" href="assets/madison-rothschild-resume.pdf" download="Madison_Rothschild_Resume.pdf">Download PDF</a>
      <a class="btn" href="mailto:msrothschild@icloud.com">Contact me</a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="viewer">
    <object data="assets/madison-rothschild-resume.pdf" type="application/pdf" aria-label="Madison Rothschild's resume PDF">
      <div class="fallback">
        <p>Your browser can't display the PDF inline — no problem, you can open it directly instead.</p>
        <a class="btn solid" href="assets/madison-rothschild-resume.pdf" target="_blank" rel="noopener">Open resume</a>
      </div>
    </object>
  </div>
</div>

<footer>© 2026 Madison Rothschild — Marketing Portfolio</footer>

</body>
</html>
